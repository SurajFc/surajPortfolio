<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1220"/>
      <stop offset="100%" style="stop-color:#0a1a2e"/>
    </linearGradient>
    <linearGradient id="route" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- faux 3D map grid (perspective) -->
  <g stroke="#38bdf810" stroke-width="1">
    <line x1="0" y1="120" x2="800" y2="90"/>
    <line x1="0" y1="200" x2="800" y2="160"/>
    <line x1="0" y1="290" x2="800" y2="250"/>
    <line x1="0" y1="380" x2="800" y2="360"/>
    <line x1="120" y1="0" x2="60" y2="450"/>
    <line x1="320" y1="0" x2="300" y2="450"/>
    <line x1="520" y1="0" x2="540" y2="450"/>
    <line x1="700" y1="0" x2="760" y2="450"/>
  </g>
  <!-- building blocks -->
  <g fill="#1e3a5f" opacity="0.5">
    <rect x="150" y="150" width="40" height="40" rx="3"/>
    <rect x="600" y="180" width="50" height="50" rx="3"/>
    <rect x="500" y="300" width="45" height="45" rx="3"/>
    <rect x="250" y="320" width="38" height="38" rx="3"/>
  </g>

  <!-- the animated route -->
  <path d="M 90 360 C 200 300, 180 220, 320 210 S 560 240, 600 140 S 700 90, 730 70"
        fill="none" stroke="url(#route)" stroke-width="6" stroke-linecap="round"
        stroke-dasharray="14 10" opacity="0.95">
    <animate attributeName="stroke-dashoffset" from="240" to="0" dur="2.5s" repeatCount="indefinite"/>
  </path>
  <!-- start / end pins -->
  <circle cx="90" cy="360" r="8" fill="#22c55e" stroke="#0b1220" stroke-width="3"/>
  <circle cx="730" cy="70" r="8" fill="#ef4444" stroke="#0b1220" stroke-width="3"/>

  <!-- vehicle (motorbike dot) chasing the route -->
  <g>
    <circle cx="0" cy="0" r="11" fill="#f8fafc" stroke="#0ea5e9" stroke-width="3">
      <animateMotion dur="2.5s" repeatCount="indefinite" rotate="auto"
        path="M 90 360 C 200 300, 180 220, 320 210 S 560 240, 600 140 S 700 90, 730 70"/>
    </circle>
  </g>

  <!-- overlay: title card + distance counter -->
  <rect x="40" y="36" width="190" height="52" rx="10" fill="#00000066" stroke="#38bdf833" stroke-width="1"/>
  <text x="58" y="60" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f1f5f9">Himalaya Ride</text>
  <text x="58" y="78" font-family="monospace" font-size="12" fill="#38bdf8">128.4 km</text>

  <!-- export format chips -->
  <g font-family="sans-serif" font-size="11">
    <rect x="560" y="400" width="52" height="24" rx="12" fill="#38bdf820" stroke="#38bdf840"/>
    <text x="586" y="416" fill="#7dd3fc" text-anchor="middle">MP4</text>
    <rect x="620" y="400" width="52" height="24" rx="12" fill="#38bdf820" stroke="#38bdf840"/>
    <text x="646" y="416" fill="#7dd3fc" text-anchor="middle">WebM</text>
    <rect x="680" y="400" width="48" height="24" rx="12" fill="#38bdf820" stroke="#38bdf840"/>
    <text x="704" y="416" fill="#7dd3fc" text-anchor="middle">GIF</text>
  </g>
  <text x="40" y="420" font-family="monospace" font-size="13" fill="#64748b">RouteReel — route-to-video</text>
</svg>
