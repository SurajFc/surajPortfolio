<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#140d1f"/>
      <stop offset="100%" style="stop-color:#1c1030"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g stroke="#ffffff06" stroke-width="1">
    <line x1="0" y1="112" x2="800" y2="112"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="338" x2="800" y2="338"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
  </g>

  <!-- NFC tap waves -->
  <g fill="none" stroke="#a855f7" stroke-width="2" opacity="0.5">
    <circle cx="150" cy="150" r="28"><animate attributeName="r" from="20" to="60" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" from="0.6" to="0" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="150" r="40"><animate attributeName="r" from="20" to="60" dur="2s" begin="0.7s" repeatCount="indefinite"/><animate attributeName="opacity" from="0.6" to="0" dur="2s" begin="0.7s" repeatCount="indefinite"/></circle>
  </g>
  <text x="150" y="158" font-family="sans-serif" font-size="26" fill="#c4b5fd" text-anchor="middle">📶</text>
  <text x="150" y="205" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">Tap / Scan</text>

  <!-- QR code mock -->
  <rect x="80" y="250" width="130" height="130" rx="10" fill="#ffffff"/>
  <g fill="#1c1030">
    <rect x="95" y="265" width="30" height="30"/><rect x="165" y="265" width="30" height="30"/><rect x="95" y="335" width="30" height="30"/>
    <rect x="103" y="273" width="14" height="14" fill="#ffffff"/><rect x="173" y="273" width="14" height="14" fill="#ffffff"/><rect x="103" y="343" width="14" height="14" fill="#ffffff"/>
    <rect x="140" y="275" width="8" height="8"/><rect x="152" y="300" width="8" height="8"/><rect x="135" y="310" width="8" height="8"/><rect x="165" y="320" width="8" height="8"/><rect x="180" y="340" width="8" height="8"/><rect x="150" y="345" width="8" height="8"/><rect x="135" y="350" width="8" height="8"/><rect x="170" y="300" width="8" height="8"/>
  </g>

  <!-- phone profile card -->
  <rect x="470" y="50" width="200" height="350" rx="26" fill="#0f0a18" stroke="#8b5cf640" stroke-width="2"/>
  <rect x="470" y="50" width="200" height="90" rx="26" fill="url(#accent)" opacity="0.9"/>
  <rect x="470" y="110" width="200" height="30" fill="url(#accent)" opacity="0.9"/>
  <circle cx="570" cy="120" r="34" fill="#0f0a18" stroke="#ffffff" stroke-width="3"/>
  <text x="570" y="130" font-family="sans-serif" font-size="26" fill="#c4b5fd" text-anchor="middle">👤</text>
  <text x="570" y="170" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f1f5f9" text-anchor="middle">Cafe Mountain</text>
  <text x="570" y="188" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Coffee &amp; Bakery</text>

  <!-- action buttons -->
  <g font-family="sans-serif" font-size="10">
    <rect x="490" y="210" width="78" height="30" rx="8" fill="#22c55e20" stroke="#22c55e40"/>
    <text x="529" y="229" fill="#4ade80" text-anchor="middle">📞 Call</text>
    <rect x="572" y="210" width="78" height="30" rx="8" fill="#25d36620" stroke="#25d36640"/>
    <text x="611" y="229" fill="#4ade80" text-anchor="middle">WhatsApp</text>
    <rect x="490" y="248" width="78" height="30" rx="8" fill="#fbbf2420" stroke="#fbbf2440"/>
    <text x="529" y="267" fill="#fcd34d" text-anchor="middle">★ Review</text>
    <rect x="572" y="248" width="78" height="30" rx="8" fill="#8b5cf620" stroke="#8b5cf640"/>
    <text x="611" y="267" fill="#c4b5fd" text-anchor="middle">UPI Pay</text>
    <rect x="490" y="286" width="160" height="30" rx="8" fill="#38bdf820" stroke="#38bdf840"/>
    <text x="570" y="305" fill="#7dd3fc" text-anchor="middle">🌐 Website &amp; Socials</text>
  </g>
  <text x="570" y="350" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">aitap.in/c/8F2KQ</text>

  <text x="40" y="420" font-family="monospace" font-size="13" fill="#64748b">AiTap — NFC / QR smart cards</text>
</svg>
